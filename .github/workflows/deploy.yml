name: Deploy to Production Ubuntu Server

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use for hotfixes only)'
        required: false
        default: 'false'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: alkana_dashboard
          POSTGRES_USER: alkana_user
          POSTGRES_PASSWORD: testpass123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: postgresql://alkana_user:testpass123@localhost:5432/alkana_dashboard
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema
        run: python -m src.main init
        env:
          DATABASE_URL: postgresql://alkana_user:testpass123@localhost:5432/alkana_dashboard

      - name: Run backend tests
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term
        continue-on-error: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd web
          npm ci

      - name: Run frontend tests
        run: |
          cd web
          npm test -- --run --coverage
        continue-on-error: true

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: alkana-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: alkana-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env.production on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/alkana-dashboard
            cat > .env.production << 'ENVEOF'
          DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ secrets.DB_NAME }}
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DEMODATA_PATH=/app/demodata
          ENVIRONMENT=production
          DEBUG=false
          ALLOWED_ORIGINS=http://${{ secrets.SERVER_HOST }},http://192.168.18.35
          STUCK_IN_TRANSIT_HOURS=48
          LOW_YIELD_THRESHOLD=85
          ENVEOF
          EOF

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd ~/alkana-dashboard
            
            # Pull latest code
            if [ ! -d ".git" ]; then
              echo "Cloning repository for first time..."
              cd ~
              rm -rf alkana-dashboard
              git clone ${{ github.server_url }}/${{ github.repository }}.git alkana-dashboard
              cd alkana-dashboard
            else
              echo "Pulling latest code..."
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            fi
            
            # Backup database if exists
            if docker compose -f docker-compose.prod.yml ps postgres | grep -q "Up"; then
              echo "Backing up database..."
              mkdir -p backups
              docker compose -f docker-compose.prod.yml exec -T postgres \
                pg_dump -U ${{ secrets.DB_USER }} ${{ secrets.DB_NAME }} 2>/dev/null | \
                gzip > backups/backup-$(date +%Y%m%d-%H%M%S).sql.gz || echo "Database backup skipped (new deployment)"
            fi
            
            # Build and start services
            echo "Building images..."
            docker compose -f docker-compose.prod.yml build --no-cache
            
            echo "Starting services..."
            docker compose -f docker-compose.prod.yml up -d
            
            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 30
            
            # Initialize database if needed
            if ! docker compose -f docker-compose.prod.yml exec -T postgres psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -c "SELECT 1 FROM dim_material LIMIT 1" 2>/dev/null; then
              echo "Initializing database..."
              docker compose -f docker-compose.prod.yml exec -T backend python -m src.main init || echo "Database already initialized"
            fi
            
            # Check service health
            echo "Checking service health..."
            docker compose -f docker-compose.prod.yml ps
            
            # Clean up old images
            docker image prune -af --filter "until=72h" || true
            
            echo "Deployment complete!"
          EOF

      - name: Health check
        run: |
          sleep 15
          max_attempts=5
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts..."
            
            if curl -f http://${{ secrets.SERVER_HOST }}/api/health; then
              echo "✅ API health check passed"
              exit 0
            fi
            
            attempt=$((attempt + 1))
            sleep 10
          done
          
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Time: $(date)"

      - name: Rollback on failure
        if: failure()
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/alkana-dashboard
            git reset --hard HEAD~1
            docker compose -f docker-compose.prod.yml up -d --build
          EOF
          echo "❌ Deployment failed. Rolled back to previous version."

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - name: Cleanup SSH keys
        run: |
          rm -f ~/.ssh/id_ed25519
