name: Auto Deploy to Alkana Server

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  SERVER_IP: 192.168.68.166
  SERVER_USER: alkana

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: alkana_dashboard
          POSTGRES_USER: alkana_user
          POSTGRES_PASSWORD: testpass123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: postgresql://alkana_user:testpass123@localhost:5432/alkana_dashboard
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema
        run: python -m src.main init
        env:
          DATABASE_URL: postgresql://alkana_user:testpass123@localhost:5432/alkana_dashboard

      - name: Run backend tests
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term
        continue-on-error: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd web
          npm ci

      - name: Run frontend tests
        run: |
          cd web
          npm test -- --run --coverage
        continue-on-error: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # Create deployment script
          cat > /tmp/deploy.sh << 'DEPLOYEOF'
          set -e
          
          cd ~/alkana-dashboard || mkdir -p ~/alkana-dashboard
          
          # Pull latest code
          if [ -d .git ]; then
            git pull origin ${{ github.ref_name }} || git clone https://github.com/${{ github.repository }}.git .
          else
            git clone https://github.com/${{ github.repository }}.git .
          fi
          
          # Create environment file
          cat > .env.production << 'ENVEOF'
          DATABASE_URL=postgresql://alkana_user:${{ secrets.DB_PASSWORD }}@postgres:5432/alkana_dashboard
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=alkana_dashboard
          DB_USER=alkana_user
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ENVIRONMENT=production
          DEBUG=false
          API_BASE_URL=http://192.168.68.166/api
          ALLOWED_ORIGINS=http://192.168.68.166
          DEMODATA_PATH=/app/demodata
          STUCK_IN_TRANSIT_HOURS=48
          LOW_YIELD_THRESHOLD=85
          ENVEOF
          
          # Backup database if exists
          if docker compose -f docker-compose.prod.yml ps | grep -q postgres; then
            docker compose -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U alkana_user alkana_dashboard 2>/dev/null | \
              gzip > backups/backup-$(date +%Y%m%d-%H%M%S).sql.gz || true
          fi
          
          # Build and deploy
          docker compose -f docker-compose.prod.yml build --no-cache
          docker compose -f docker-compose.prod.yml up -d
          
          # Wait for services
          sleep 30
          
          # Check health
          docker compose -f docker-compose.prod.yml ps
          
          # Clean up
          docker image prune -af --filter "until=72h"
          
          echo "Deployment completed successfully"
          DEPLOYEOF
          
          # Upload and execute
          sshpass -p "$SERVER_PASSWORD" scp /tmp/deploy.sh \
            ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:/tmp/deploy.sh
          
          sshpass -p "$SERVER_PASSWORD" ssh \
            ${{ env.SERVER_USER }}@${{ env.SERVER_IP }} \
            "bash /tmp/deploy.sh"

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ env.SERVER_IP }}/health || echo "Frontend not ready"
          curl -f http://${{ env.SERVER_IP }}/api/health || echo "API not ready"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Access: http://${{ env.SERVER_IP }}"

      - name: Rollback on failure
        if: failure()
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh \
            ${{ env.SERVER_USER }}@${{ env.SERVER_IP }} \
            "cd ~/alkana-dashboard && \
             git reset --hard HEAD~1 && \
             docker compose -f docker-compose.prod.yml up -d --build"
          echo "❌ Deployment failed. Rolled back."
